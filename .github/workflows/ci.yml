name: ci
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python tools compile
        run: python3 -m py_compile tools/*.py
      - name: "Runtime compiles (no game needed, the generated tables are optional)"
        run: |
          set -e
          for f in runtime/*.c runtime/*.m; do
            echo "== $f"
            clang -w -fobjc-arc -fsyntax-only -I runtime "$f"
          done
      - name: Shell scripts parse
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
